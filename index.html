<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音楽研究部</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #c0392b;
      --secondary: #2c3e50;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #333;
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid #eee;
    }
    h1, h2, h3 { margin-top: 0; color: var(--secondary); }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { opacity: 0.9; }
    .btn-secondary { background-color: var(--secondary); }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
    .checkbox-group label { font-weight: normal; margin-top: 0; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;
    }
    .nav-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; border-bottom: 2px solid #ccc; }
    .nav-tab { padding: 10px 15px; cursor: pointer; white-space: nowrap; font-weight: bold; border-radius: 6px 6px 0 0; }
    .nav-tab.active { background: var(--primary); color: white; }
    .hidden { display: none !important; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; background: #eee; margin-right: 5px; }
    .badge-exec { background: #e74c3c; color: white; }
    .badge-leader { background: #f39c12; color: white; }
    .chat-box { height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fafafa; margin-bottom: 10px; }
    .chat-msg { margin-bottom: 10px; padding: 8px; border-radius: 6px; background: white; border: 1px solid #eee; }
    .chat-msg .sender { font-weight: bold; font-size: 0.85em; color: var(--secondary); }
    .admin-card { border: 2px solid var(--primary); background: #fff5f5; }
  </style>
</head>
<body>
<div class="container">
  <!-- ヘッダー -->
  <div class="card">
    <h1 style="margin:0;">🎵 音楽研究部</h1>
    <div id="user-info" style="margin-top: 5px; font-size:0.9em; color:#666;">読み込み中...</div>
  </div>

  <!-- ナビゲーションタブ -->
  <div class="nav-tabs" id="tab-menu">
    <div class="nav-tab active" onclick="switchTab('tab-reservation')">部室予約</div>
    <div class="nav-tab" onclick="switchTab('tab-bbs')">メンバー募集掲示板</div>
    <div class="nav-tab" onclick="switchTab('tab-roster')">部員名簿</div>
    <div class="nav-tab" onclick="switchTab('tab-chat')">バンドチャット</div>
    <div class="nav-tab" onclick="switchTab('tab-shift-req')">シフト希望</div>
    <div class="nav-tab hidden" id="admin-tab-btn" onclick="switchTab('tab-admin')">👑 幹部専用</div>
  </div>

  <!-- 1. 部室予約タブ -->
  <div id="tab-reservation" class="tab-content">
    <!-- イベント案内 -->
    <div class="card" style="background:#e8f4f8; border-color:#3498db;">
      <h3 style="color:#2980b9;">📅 全体イベント・お知らせ</h3>
      <ul id="event-list" style="margin:0; padding-left:20px;">
        <li><strong>11月20日(金):</strong> 部活全体ライブ！ (部室終日使用不可)</li>
      </ul>
    </div>

    <!-- 本日のシフト -->
    <div class="card">
      <h3>📅 本日のシフト・予約状況</h3>
      <input type="date" id="view-date" onchange="loadReservations()">
      <div id="reservation-list" style="margin-top:10px;"></div>
    </div>

    <!-- 新規予約フォーム -->
    <div class="card">
      <h3>⏰ 新規部室予約（最大1週間先まで）</h3>
      <form id="form-reservation" onsubmit="handleReservation(event)">
        <label>予約日</label>
        <input type="date" id="res-date" required>
        <label>時間帯（9:00〜20:00 / 1時間単位）</label>
        <select id="res-time" required>
          <option value="09:00-10:00">09:00 - 10:00</option>
          <option value="10:00-11:00">10:00 - 11:00</option>
          <option value="11:00-12:00">11:00 - 12:00</option>
          <option value="12:00-13:00">12:00 - 13:00</option>
          <option value="13:00-14:00">13:00 - 14:00</option>
          <option value="14:00-15:00">14:00 - 15:00</option>
          <option value="15:00-16:00">15:00 - 16:00</option>
          <option value="16:00-17:00">16:00 - 17:00</option>
          <option value="17:00-18:00">17:00 - 18:00</option>
          <option value="18:00-19:00">18:00 - 19:00</option>
          <option value="19:00-20:00">19:00 - 20:00</option>
        </select>
        <label>使用目的 / バンド名</label>
        <input type="text" id="res-purpose" placeholder="例: 個人練習 / りんごジャム" required>
        <button type="submit">予約を完了する</button>
      </form>
    </div>
  </div>

  <!-- 2. メンバー募集掲示板 -->
  <div id="tab-bbs" class="tab-content hidden">
    <div class="card">
      <h3>🔍 バンドメンバー募集掲示板</h3>
      <label>募集パートで絞り込み</label>
      <select id="bbs-filter" onchange="loadBBS()">
        <option value="ALL">すべてのパート</option>
        <option value="Gt">Gt (ギター)</option>
        <option value="Ba">Ba (ベース)</option>
        <option value="Dr">Dr (ドラム)</option>
        <option value="Vo">Vo (ボーカル)</option>
        <option value="Key">Key (キーボード)</option>
      </select>
    </div>
    <div class="card">
      <h3>✍️ 募集を投稿する</h3>
      <form id="form-bbs" onsubmit="handlePostBBS(event)">
        <label>募集パート</label>
        <select id="post-part" required>
          <option value="Gt">Gt (ギター)</option>
          <option value="Ba">Ba (ベース)</option>
          <option value="Dr">Dr (ドラム)</option>
          <option value="Vo">Vo (ボーカル)</option>
          <option value="Key">Key (キーボード)</option>
        </select>
        <label>募集内容・詳細</label>
        <textarea id="post-text" rows="3" placeholder="コピーバンドのDrを探しています！" required></textarea>
        <button type="submit">投稿する</button>
      </form>
    </div>
    <div id="bbs-posts"></div>
  </div>

  <!-- 3. 部員名簿 -->
  <div id="tab-roster" class="tab-content hidden">
    <div class="card">
      <h3>👥 部員名簿</h3>
      <div style="display:flex; gap:10px;">
        <button class="btn-secondary" onclick="loadRoster('grade')">学年順で並び替え</button>
        <button class="btn-secondary" onclick="loadRoster('dept')">学科順で並び替え</button>
      </div>
      <div id="roster-list" style="margin-top:15px;"></div>
    </div>
  </div>

  <!-- 4. バンドチャット -->
  <div id="tab-chat" class="tab-content hidden">
    <div class="card">
      <h3>💬 バンド内専用チャット</h3>
      <label>対象バンド選択</label>
      <select id="chat-band-select" onchange="loadChat()">
        <!-- JSで動的生成 -->
      </select>
      <div class="chat-box" id="chat-messages"></div>
      <form id="form-chat" onsubmit="handleSendChat(event)">
        <input type="text" id="chat-input" placeholder="メッセージを入力..." required>
        <button type="submit">送信</button>
      </form>
    </div>
  </div>

  <!-- 5. シフト希望 -->
  <div id="tab-shift-req" class="tab-content hidden">
    <div class="card">
      <h3>📝 バンドシフト希望申請（バンドリーダー専用）</h3>
      <form id="form-shift-req" onsubmit="handleShiftRequest(event)">
        <label>バンド名</label>
        <input type="text" id="req-band-name" required placeholder="例: キリカ">
        <label>第1希望（日時・時間帯）</label>
        <input type="text" id="req-choice1" required placeholder="月曜 16:00-17:00">
        <label>第2希望</label>
        <input type="text" id="req-choice2" placeholder="水曜 17:00-18:00">
        <label>第3希望</label>
        <input type="text" id="req-choice3" placeholder="金曜 15:00-16:00">
        <button type="submit">希望を提出する</button>
      </form>
    </div>
  </div>

  <!-- 6. 幹部専用メニュー -->
  <div id="tab-admin" class="tab-content hidden">
    <div class="card admin-card">
      <h3>👑 幹部専用管理メニュー</h3>
      
      <h4>1. 確定シフト一括反映</h4>
      <label>開始日</label>
      <input type="date" id="admin-start-date">
      <label>終了日</label>
      <input type="date" id="admin-end-date">
      <button onclick="applyBatchShifts()">確定シフトを期間適用する</button>

      <hr style="margin:20px 0;">

      <h4>2. 部室の使用不可期間設定</h4>
      <label>開始日</label>
      <input type="date" id="block-start-date">
      <label>終了日</label>
      <input type="date" id="block-end-date">
      <label>理由</label>
      <input type="text" id="block-reason" placeholder="例: 定期テスト期間のため">
      <button onclick="setBlockPeriod()">指定期間を使用不可にする</button>

      <hr style="margin:20px 0;">

      <h4>3. 部費納入管理</h4>
      <div id="fee-management-list"></div>
    </div>
  </div>
</div>

<!-- プロフィール登録（入部届）モーダル -->
<div id="profile-modal" class="modal hidden">
  <div class="modal-content">
    <h2>📝 プロフィール登録</h2>
    <form id="form-profile" onsubmit="handleSaveProfile(event)">
      <label>名前（例: 村田柾陽）</label>
      <input type="text" id="prof-name" placeholder="村田柾陽" required>

      <label>LINE表示名（例: まさはる）</label>
      <input type="text" id="prof-line" placeholder="まさはる" required>

      <label>学年</label>
      <select id="prof-grade" onchange="toggleDeptSelect()" required>
        <option value="1年">1年</option>
        <option value="2年">2年</option>
        <option value="3年">3年</option>
        <option value="4年">4年</option>
        <option value="5年">5年</option>
        <option value="専攻科1年">専攻科1年</option>
        <option value="専攻科2年">専攻科2年</option>
      </select>

      <div id="dept-group">
        <label>学科</label>
        <select id="prof-dept">
          <option value="AC">AC</option>
          <option value="BC">BC</option>
          <option value="MI">MI</option>
        </select>
      </div>

      <label>担当パート（複数選択可）</label>
      <div class="checkbox-group">
        <label><input type="checkbox" class="part-cb" value="Gt"> Gt</label>
        <label><input type="checkbox" class="part-cb" value="Ba"> Ba</label>
        <label><input type="checkbox" class="part-cb" value="Dr"> Dr</label>
        <label><input type="checkbox" class="part-cb" value="Vo"> Vo</label>
        <label><input type="checkbox" class="part-cb" value="Key"> Key</label>
      </div>

      <label>役職</label>
      <select id="prof-role" required>
        <option value="部員">部員</option>
        <option value="部長">部長</option>
        <option value="副部長">副部長</option>
        <option value="会計">会計</option>
      </select>

      <label>所属バンド（カンマ区切り）& バンドリーダー設定</label>
      <input type="text" id="prof-bands" placeholder="例: キリカ, りんごジャム">
      <label><input type="checkbox" id="prof-is-leader"> 所属バンドのリーダーを務めている</label>

      <label>一言コメント</label>
      <textarea id="prof-comment" rows="2" placeholder="よろしくお願いします！"></textarea>

      <button type="submit">登録して完了する</button>
    </form>
  </div>
</div>

<script>
  // Firebase Initialization
  const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForDeploymentStandard",
    authDomain: "onken-app.firebaseapp.com",
    projectId: "onken-app",
    storageBucket: "onken-app.app照感.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentUser = null;

  window.addEventListener('DOMContentLoaded', () => {
    // 予約日付の初期化（今日）
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('view-date').value = today;
    document.getElementById('res-date').value = today;
    document.getElementById('res-date').min = today;

    // 1週間後の日付制限
    const maxDate = new Date();
    maxDate.setDate(maxDate.getDate() + 7);
    document.getElementById('res-date').max = maxDate.toISOString().split('T')[0];

    initApp();
  });

  function initApp() {
    const saved = localStorage.getItem('onken_user');
    if (!saved) {
      document.getElementById('profile-modal').classList.remove('hidden');
    } else {
      currentUser = JSON.parse(saved);
      renderUI();
    }
  }

  function toggleDeptSelect() {
    const grade = document.getElementById('prof-grade').value;
    const deptGroup = document.getElementById('dept-group');
    if (grade.includes('専攻科')) {
      deptGroup.classList.add('hidden');
    } else {
      deptGroup.classList.remove('hidden');
    }
  }

  function handleSaveProfile(e) {
    e.preventDefault();
    const parts = Array.from(document.querySelectorAll('.part-cb:checked')).map(cb => cb.value);
    const grade = document.getElementById('prof-grade').value;
    const dept = grade.includes('専攻科') ? '-' : document.getElementById('prof-dept').value;

    currentUser = {
      id: 'user_' + Date.now(),
      name: document.getElementById('prof-name').value,
      lineName: document.getElementById('prof-line').value,
      grade: grade,
      dept: dept,
      parts: parts,
      role: document.getElementById('prof-role').value,
      bands: document.getElementById('prof-bands').value.split(',').map(b => b.trim()).filter(b => b),
      isLeader: document.getElementById('prof-is-leader').checked,
      comment: document.getElementById('prof-comment').value,
      feePaid: false
    };

    localStorage.setItem('onken_user', JSON.stringify(currentUser));
    db.collection('users').doc(currentUser.id).set(currentUser);
    document.getElementById('profile-modal').classList.add('hidden');
    renderUI();
  }

  function renderUI() {
    // ヘッダー情報
    const isExec = ['部長', '副部長', '会計'].includes(currentUser.role);
    document.getElementById('user-info').innerHTML = `
      <strong>${currentUser.name}</strong> (${currentUser.lineName}) - ${currentUser.grade} ${currentUser.dept} / ${currentUser.parts.join(',')}
      ${isExec ? '<span class="badge badge-exec">幹部</span>' : ''}
      ${currentUser.isLeader ? '<span class="badge badge-leader">バンドリーダー</span>' : ''}
    `;

    // 幹部タブ制御
    if (isExec) {
      document.getElementById('admin-tab-btn').classList.remove('hidden');
    }

    // チャット用バンドリスト
    const bandSelect = document.getElementById('chat-band-select');
    bandSelect.innerHTML = currentUser.bands.map(b => `<option value="${b}">${b}</option>`).join('');

    loadReservations();
    loadBBS();
    loadRoster('grade');
    loadFeeManagement();
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.remove('hidden');
    event.target.classList.add('active');

    if (tabId === 'tab-chat') loadChat();
  }

  // 予約ロード
  function loadReservations() {
    const date = document.getElementById('view-date').value;
    const container = document.getElementById('reservation-list');
    container.innerHTML = '<p>読み込み中...</p>';

    db.collection('reservations').where('date', '==', date).get().then(snapshot => {
      if (snapshot.empty) {
        container.innerHTML = '<p>この日の予約はありません。</p>';
        return;
      }
      let html = '<ul>';
      snapshot.forEach(doc => {
        const data = doc.data();
        html += `<li><strong>${data.time}:</strong> ${data.purpose} (${data.userName})</li>`;
      });
      html += '</ul>';
      container.innerHTML = html;
    }).catch(() => {
      container.innerHTML = '<p>予約データの読み込みに失敗しました。</p>';
    });
  }

  // 新規予約
  function handleReservation(e) {
    e.preventDefault();
    const date = document.getElementById('res-date').value;
    const time = document.getElementById('res-time').value;
    const purpose = document.getElementById('res-purpose').value;

    db.collection('reservations').add({
      date, time, purpose,
      userId: currentUser.id,
      userName: currentUser.name,
      createdAt: new Date()
    }).then(() => {
      alert('予約が完了しました！');
      loadReservations();
    });
  }

  // 掲示板ロード
  function loadBBS() {
    const filter = document.getElementById('bbs-filter').value;
    const container = document.getElementById('bbs-posts');
    container.innerHTML = '<p>読み込み中...</p>';

    db.collection('bbs').orderBy('createdAt', 'desc').get().then(snapshot => {
      let html = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        if (filter === 'ALL' || data.part === filter) {
          html += `
            <div class="card">
              <h4>【募集パート: ${data.part}】</h4>
              <p>${data.text}</p>
              <small>投稿者: ${data.userName} (${data.userLine})</small>
            </div>
          `;
        }
      });
      container.innerHTML = html || '<p>該当する募集はありません。</p>';
    });
  }

  function handlePostBBS(e) {
    e.preventDefault();
    db.collection('bbs').add({
      part: document.getElementById('post-part').value,
      text: document.getElementById('post-text').value,
      userName: currentUser.name,
      userLine: currentUser.lineName,
      createdAt: new Date()
    }).then(() => {
      document.getElementById('post-text').value = '';
      loadBBS();
    });
  }

  // 名簿ロード
  function loadRoster(sortBy) {
    const container = document.getElementById('roster-list');
    db.collection('users').get().then(snapshot => {
      let users = [];
      snapshot.forEach(doc => users.push(doc.data()));

      users.sort((a, b) => (a[sortBy] > b[sortBy]) ? 1 : -1);

      let html = '<table style="width:100%; text-align:left; border-collapse:collapse;"><tr><th>学年/学科</th><th>名前 (LINE)</th><th>パート</th><th>役職</th></tr>';
      users.forEach(u => {
        html += `<tr style="border-bottom:1px solid #ddd;">
          <td>${u.grade} ${u.dept}</td>
          <td>${u.name} (${u.lineName}) ${u.isLeader ? '👑' : ''}</td>
          <td>${u.parts ? u.parts.join(',') : ''}</td>
          <td>${u.role}</td>
        </tr>`;
      });
      html += '</table>';
      container.innerHTML = html;
    });
  }

  // チャット機能
  function loadChat() {
    const band = document.getElementById('chat-band-select').value;
    const container = document.getElementById('chat-messages');
    if (!band) {
      container.innerHTML = '<p>所属バンドが設定されていません。</p>';
      return;
    }
    db.collection('chats').doc(band).collection('messages').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
      let html = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        html += `<div class="chat-msg"><div class="sender">${d.userName}</div><div>${d.text}</div></div>`;
      });
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    });
  }

  function handleSendChat(e) {
    e.preventDefault();
    const band = document.getElementById('chat-band-select').value;
    const input = document.getElementById('chat-input');
    if (!band) return;

    db.collection('chats').doc(band).collection('messages').add({
      text: input.value,
      userName: currentUser.name,
      createdAt: new Date()
    }).then(() => input.value = '');
  }

  // シフト希望提出
  function handleShiftRequest(e) {
    e.preventDefault();
    db.collection('shift_requests').add({
      bandName: document.getElementById('req-band-name').value,
      choice1: document.getElementById('req-choice1').value,
      choice2: document.getElementById('req-choice2').value,
      choice3: document.getElementById('req-choice3').value,
      submittedBy: currentUser.name,
      createdAt: new Date()
    }).then(() => alert('シフト希望を提出しました！'));
  }

  // 幹部用：部費納入
  function loadFeeManagement() {
    const container = document.getElementById('fee-management-list');
    db.collection('users').get().then(snapshot => {
      let html = '<ul>';
      snapshot.forEach(doc => {
        const u = doc.data();
        html += `<li>${u.name} (${u.grade}): ${u.feePaid ? '✅ 納入済み' : '❌ 未納'} 
        <button style="width:auto; padding:2px 8px; margin:0;" onclick="toggleFee('${doc.id}', ${!u.feePaid})">切替</button></li>`;
      });
      html += '</ul>';
      container.innerHTML = html;
    });
  }

  function toggleFee(id, status) {
    db.collection('users').doc(id).update({ feePaid: status }).then(() => loadFeeManagement());
  }

  // 幹部用：期間ブロック
  function setBlockPeriod() {
    const start = document.getElementById('block-start-date').value;
    const end = document.getElementById('block-end-date').value;
    const reason = document.getElementById('block-reason').value;
    if (!start || !end) return alert('日付を入力してください');
    
    db.collection('blocked_periods').add({ start, end, reason }).then(() => alert('指定期間を予約不可に設定しました'));
  }
</script>
</body>
</html>
