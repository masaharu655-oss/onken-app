<!doctype html>

<title>音研 練習枠予約（ベータ版）</title>

<style>
:root {
  --paper: #F1EFE6; --card: #FAF8F1; --ink: #1F1D18; --mute: #6B675A; --line: #D9D5C6;
  --amp: #C23B2B; --amp-ink: #FFFFFF; --mine: #1D5A55; --mine-bg: #DCEAE5;
  --font-ui: "Zen Kaku Gothic New", sans-serif; --font-mono: "DM Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); padding: 16px; }
.app { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
h1 { margin: 0 0 4px; font-size: 24px; }
p { margin: 0; font-size: 13px; color: var(--mute); }
.field { margin-bottom: 12px; }
label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); font: inherit; }
button { background: var(--ink); color: var(--paper); font-weight: bold; cursor: pointer; border: none; margin-top: 8px; }
button.admin-btn { background: var(--amp); color: var(--amp-ink); }
.modal-gate { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
.modal-content { background: var(--card); border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; }
.slot-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
</style>
</head>

<body>
<div class="app">
  <!-- 入部届（未登録用ゲート） -->
  <div id="gate" class="modal-gate" style="display:none;">
    <div class="modal-content">
      <h2>【音研】入部届・プロフィール登録</h2>
      <p style="margin-bottom: 16px;">アプリを利用するにはプロフィールの登録が必要です。</p>
      <div class="field">
        <label>名前（フルネーム）</label>
        <input type="text" id="p-name" placeholder="音研 太郎">
      </div>
      <div class="field">
        <label>学年</label>
        <select id="p-grade">
          <option value="1年">1年</option><option value="2年">2年</option>
          <option value="3年">3年</option><option value="4年">4年</option><option value="5年">5年</option>
        </select>
      </div>
      <div class="field">
        <label>パート</label>
        <input type="text" id="p-part" placeholder="Vo, Gt, Ba, Dr, Key など">
      </div>
      <div class="field">
        <label>役職</label>
        <select id="p-role">
          <option value="部員">部員</option>
          <option value="幹部">幹部（部長・副部長・会計）</option>
        </select>
      </div>
      <button id="save-profile-btn" onclick="saveProfile()">保存して利用開始</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="card">
    <h1>音楽研究部 予約</h1>
    <p id="user-info">読み込み中...</p>
  </div>

  <!-- 幹部メニュー（幹部のみ表示） -->
  <div id="admin-menu" class="card" style="display:none; border-color: var(--amp);">
    <h3 style="margin:0 0 8px; color:var(--amp);">🛠 幹部メニュー（シフト一括反映）</h3>
    <p style="margin-bottom: 12px;">指定した期間内の全曜日に確定シフトを一括適用します。</p>
    <div class="field">
      <label>開始日</label>
      <input type="date" id="shift-start">
    </div>
    <div class="field">
      <label>終了日（冬休み前まで）</label>
      <input type="date" id="shift-end">
    </div>
    <button class="admin-btn" onclick="applyMasterShifts()">確定シフトを期間適用する</button>
  </div>

  <!-- 予約スケジュール表示 -->
  <div class="card">
    <h3>📅 本日のシフト / 予約</h3>
    <div id="schedule-list">読み込み中...</div>
  </div>
</div>

<script>
let currentUser = null;

// 初期化と入部届判定
async function initApp() {
  let uid = localStorage.getItem("kon.uid");
  if (!uid) {
    uid = "u_" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("kon.uid", uid);
  }

  // ユーザー情報取得
  const doc = await db.collection("members").doc(uid).get();
  if (!doc.exists) {
    document.getElementById("gate").style.display = "flex";
  } else {
    currentUser = doc.data();
    document.getElementById("gate").style.display = "none";
    renderUserUI();
  }
}

// プロフィール保存
async function saveProfile() {
  const btn = document.getElementById("save-profile-btn");
  const name = document.getElementById("p-name").value.trim();
  const grade = document.getElementById("p-grade").value;
  const part = document.getElementById("p-part").value.trim();
  const role = document.getElementById("p-role").value;

  if (!name || !part) {
    alert("名前とパートを入力してください");
    return;
  }

  btn.disabled = true;
  btn.innerText = "保存中...";

  const uid = localStorage.getItem("kon.uid");
  const userData = { uid, name, grade, part, role, updatedAt: Date.now() };

  try {
    await db.collection("members").doc(uid).set(userData);
    currentUser = userData;
    document.getElementById("gate").style.display = "none";
    renderUserUI();
  } catch (e) {
    alert("保存に失敗しました。もう一度お試しください。");
    btn.disabled = false;
    btn.innerText = "保存して利用開始";
  }
}

// ユーザーUI更新
function renderUserUI() {
  document.getElementById("user-info").innerText = 
    `${currentUser.name} さん（${currentUser.grade} / ${currentUser.part}） - 区分: ${currentUser.role}`;

  // 幹部メニュー表示制御
  if (currentUser.role === "幹部") {
    document.getElementById("admin-menu").style.display = "block";
    // デフォルト日付セット（今日〜12/23冬休み直前）
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("shift-start").value = today;
    document.getElementById("shift-end").value = "2026-12-23";
  }

  loadSchedule();
}

// 幹部用：シフト期間一括適用
async function applyMasterShifts() {
  const startStr = document.getElementById("shift-start").value;
  const endStr = document.getElementById("shift-end").value;

  if (!startStr || !endStr) {
    alert("開始日と終了日を選択してください");
    return;
  }

  if (!confirm(`${startStr} から ${endStr} までの期間にシフトを一括適用しますか？`)) return;

  let current = new Date(startStr);
  const end = new Date(endStr);
  const batch = db.batch();
  let count = 0;

  while (current <= end) {
    const dayOfWeek = current.getDay(); // 0:日, 1:月...6:土
    const dateKey = current.toISOString().split("T")[0];

    if (window.MASTER_SHIFTS[dayOfWeek]) {
      const dayShifts = window.MASTER_SHIFTS[dayOfWeek];
      dayShifts.forEach(s => {
        const docRef = db.collection("bookings").doc(`${dateKey}_${s.time}`);
        batch.set(docRef, {
          date: dateKey,
          time: s.time,
          band: s.band,
          createdRole: "auto-master"
        }, { merge: true });
        count++;
      });
    }
    current.setDate(current.getDate() + 1);
  }

  await batch.commit();
  alert(`一括適用完了！合計 ${count} 件の枠を設定しました。`);
  loadSchedule();
}

// スケジュール読込
async function loadSchedule() {
  const todayKey = new Date().toISOString().split("T")[0];
  const container = document.getElementById("schedule-list");
  container.innerHTML = "読み込み中...";

  const snapshot = await db.collection("bookings").where("date", "==", todayKey).get();
  if (snapshot.empty) {
    container.innerHTML = "<p>本日の固定予約はありません。</p>";
    return;
  }

  let html = "";
  snapshot.forEach(doc => {
    const data = doc.data();
    html += `<div class="slot-item"><span><b>${data.time}</b>: ${data.band}</span></div>`;
  });
  container.innerHTML = html;
}

window.onload = initApp;
</script>
</body>
</html>
